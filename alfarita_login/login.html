<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Absolvement - Login</title>

    <link rel="stylesheet" href="style.css">

    <!-- CHANGED: jQuery and jQuery Validation plugin -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/jquery-validation@1.21.0/dist/jquery.validate.min.js"></script>
</head>

<body>

    <main class="container">

        <div class="symbol">✦</div>

        <h1>Absolvement</h1>

        <p class="subtitle">
            Rise, Fragment. The Soul Continent awaits.
        </p>

        <form id="loginForm" action="#" method="post" novalidate>

            <label for="username">Username</label>
            <input
                type="text"
                id="username"
                name="username"
                placeholder="Enter your username"
                required
            >

            <label for="password">Password</label>
            <input
                type="password"
                id="password"
                name="password"
                placeholder="Enter your password"
                required
            >

            <div class="options">

                <label class="remember">
                    <input type="checkbox" name="remember">
                    Remember me
                </label>

                <a href="#">Forgot password?</a>

            </div>

            <button type="submit">Enter the Realm</button>

        </form>

        <script>
            $(document).ready(function () {
                // First-time visitors must register before they can log in.
                if (!localStorage.getItem("alfaritaAccount")) {
                    window.location.replace("register.html");
                    return;
                }

                $("#loginForm").validate({
                    rules: {
                        username: { required: true },
                        password: { required: true }
                    },
                    messages: {
                        username: { required: "Please enter your username." },
                        password: { required: "Please enter your password." }
                    },
                    errorElement: "span",

                    submitHandler: function (form) {
                        const username = $("#username").val().trim();
                        const password = $("#password").val();
                        $("#loginError").remove();

                        const savedAccount = JSON.parse(
                            localStorage.getItem("alfaritaAccount")
                        );

                        if (
                            savedAccount &&
                            username === savedAccount.username &&
                            password === savedAccount.password
                        ) {
                            sessionStorage.setItem("alfaritaLoggedIn", "true");
                            sessionStorage.setItem("alfaritaUsername", username);
                            window.location.href = "../alfarita_landingan/index.html";
                        } else {
                            $("#loginForm").after(
                                '<p id="loginError">Invalid username or password.</p>'
                            );
                        }
                    }
                });
            });
        </script>

        <p class="bottom">
            Not a warrior yet?
            <a href="register.html">Create an account</a>
        </p>

    </main>

</body>
</html>
